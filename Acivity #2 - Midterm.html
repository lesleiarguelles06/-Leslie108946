<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Poppins', Arial, sans-serif; 
      background: linear-gradient(135deg, #E8F5E9 0%, #E3F2FD 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      border-top: 6px solid #2E7D32;
    }
    .header { text-align: center; margin-bottom: 25px; }
    .header h2 { color: #0A2F5A; font-size: 26px; font-weight: 600; }
    .header p { color: #666; font-size: 14px; margin-top: 5px; }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #333; }
    input, textarea { 
      padding: 12px 15px; 
      border: 2px solid #E0E0E0; 
      border-radius: 10px; 
      font-size: 15px; 
      font-family: 'Poppins', sans-serif;
      transition: 0.3s;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.1); }
    .row { display: flex; align-items: center; gap: 10px; }
    .row input { flex: 1; }
    .note { 
      color: #2E7D32; 
      font-size: 12px; 
      background: #E8F5E9;
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    textarea { resize: none; }
    button { 
      width: 100%;
      padding: 14px; 
      background: linear-gradient(135deg, #2E7D32, #0A4D2A);
      color: white; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: 0.3s;
      margin-top: 10px;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46,125,50,0.3); }
    .footer-note { text-align: center; font-size: 11px; color: #999; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>Get In Touch</h2>
      <p>Protect Our Community, Protect Our Future</p>
    </div>
    <form id="contactForm">
      <div class="form-group">
        <label>👤 Name</label>
        <input type="text" id="name" placeholder="Juan Dela Cruz" required>
      </div>
      <div class="form-group">
        <label>📍 Address</label>
        <input type="text" id="address" placeholder="Lucena City, Quezon" required>
      </div>
      <div class="form-group">
        <label>📞 Contact #</label>
        <div class="row">
          <input type="text" id="contact" required maxlength="11" placeholder="09xxxxxxxxx">
          <span class="note">Number Only</span>
        </div>
      </div>
      <div class="form-group">
        <label>✉️ Email</label>
        <input type="email" id="email" placeholder="juan@email.com" required>
      </div>
      <div class="form-group">
        <label>💬 Message</label>
        <textarea id="message" rows="4" placeholder="Type your message here..." required></textarea>
      </div>
      <button type="submit">Send Message 🌱</button>
      <p class="footer-note">Together we can build a cleaner, greener community</p>
    </form>
  </div>

<script>
  document.getElementById('contact').addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
  });
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('✅ Form Submitted!\nThank you, ' + document.getElementById('name').value + '!');
    this.reset();
  });
</script>
</body>
</html>
